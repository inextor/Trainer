<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Day — Detail</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="day-page">
  <header class="header">
    <div class="header-inner">
      <a href="calendar.html" class="brand">
        <span class="brand-mark">TC</span>
        <span class="brand-text">
          <h1 data-i18n="day.title">Training Day</h1>
          <span class="brand-tagline" data-i18n="day.detail">Workout Detail</span>
          <span class="app-version">v1.0.7</span>
        </span>
      </a>
      <nav>
        <a href="calendar.html" data-i18n="nav.backToCalendar">← Calendar</a>
        <a href="index.html" data-i18n="nav.configuration">Configuration</a>
      </nav>
    </div>
  </header>
  <div class="app">
    <main class="day-detail-page">
      <div id="dayDetail" class="day-detail-card"></div>
      <div id="dayNotFound" class="hidden" style="text-align:center; padding:40px; color:var(--text-muted);">
        <p data-i18n="day.notFound">Day not found.</p>
        <a href="calendar.html" class="btn-primary" style="display:inline-block; margin-top:12px; text-decoration:none; padding:12px 24px; width:auto;" data-i18n="day.backToCalendar">Back to Calendar</a>
      </div>
    </main>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/workout-render.js"></script>
  <script src="js/vdot-calculator.js"></script>
  <script src="js/calendar-generator.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/fit-io.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const dateStr = params.get('date');
      if (!dateStr) {
        document.getElementById('dayNotFound').classList.remove('hidden');
        return;
      }
      // Load data
      try {
        const [vdotRes, plansRes, segmentsRes] = await Promise.all([
          fetch('data/vdot.json', {cache: 'no-store'}).then(r => r.json()),
          fetch('data/plans.json', {cache: 'no-store'}).then(r => r.json()),
          fetch('data/plans.segments.json', {cache: 'no-store'}).then(r => r.json())
        ]);
        VDOTCalculator.setTable(vdotRes.vdot);
        window.PLANS = plansRes;
        window.PLANS_2Q_SEGMENTS = segmentsRes;
      } catch(e) { console.warn(e); }
      const saved = await Storage.load();
      if (!saved || !saved.config || !saved.config.event) {
        document.getElementById('dayNotFound').classList.remove('hidden');
        return;
      }
      const cal = CalendarGenerator.generateCalendar(saved.config);
      let target = null;
      for (const w of cal.weeks) {
        for (const d of w.days) {
          const iso = d.date.toISOString().slice(0,10);
          if (iso === dateStr) { target = { day: d, week: w, cal }; break; }
        }
        if (target) break;
      }
      if (!target) {
        document.getElementById('dayNotFound').classList.remove('hidden');
        return;
      }
      const { day, week } = target;
      const units = cal.units;
      const vdot = cal.vdot;
      const t = (key, vars) => (typeof I18n !== 'undefined' ? I18n.t(key, vars) : key);
      const locale = (typeof I18n !== 'undefined' && I18n.locale === 'es') ? 'es-ES' : 'en-US';
      // Helpers (duplicated from app.js for standalone page)
      function fmtMin(min){ if(min==null) return ''; const m=Math.floor(min); const s=Math.round((min-m)*60); return s?`${m} ${t('unit.min')} ${s}${t('unit.sec')}`:`${m} ${t('unit.min')}`; }
      function fmtDist(miles, units){ if(!miles) return ''; return units==='miles'?`${miles.toFixed(1)} ${t('unit.mi')}`:`${(miles*1.609344).toFixed(1)} ${t('unit.km')}`; }
      function fmtPaceMile(spm){ const m=Math.floor(spm/60); const s=Math.round(spm%60); return `${m}:${String(s).padStart(2,'0')}`; }
      function paceForZone(zone, units){
        if(zone==='W'||zone==='rest'||zone==='ST') return '';
        const spm = CalendarGenerator.paceSecondsPerMile(vdot, zone);
        return units==='km' ? CalendarGenerator.fmtPace(spm)+'/'+t('unit.km') : fmtPaceMile(spm)+'/'+t('unit.mi');
      }
      const ZONE_NAMES = { E:t('zone.E'), M:t('zone.M'), T:t('zone.T'), I:t('zone.I'), R:t('zone.R'), L:t('zone.L'), W:t('zone.W'), ST:t('zone.ST'), rest:t('zone.rest') };
      function renderDaySteps(day, units){
        const segs = day.segments || [];
        if (!segs.length) {
          const txt = day.detail || t('day.rest');
          return `<li class="day-step"><span class="step-text">${txt}</span></li>`;
        }
        const clsMap = { E:'easy', M:'marathon', T:'tempo', I:'interval', R:'repetition', L:'long', W:'rest', ST:'repetition' };
        const n = segs.length;
        return segs.map((seg,i)=>{
          const zone = seg.p || 'E';
          const cls = clsMap[zone] || 'easy';
          const friendly = ZONE_NAMES[zone] || zone;
          const isWarm = i===0 && (zone==='E' || zone==='L');
          const isCool = i===n-1 && (zone==='E' || zone==='L') && n > 2;
          const role = isWarm ? t('day.warmup') : isCool ? t('day.cooldown') : '';
          const pace = paceForZone(zone, units);
          const amt = WorkoutRender && WorkoutRender.renderSegments([seg], units) || zone;
          return `<li class="day-step"><span class="zone-chip ${cls}">${zone}</span><span class="step-text">${amt}${friendly && friendly !== zone ? ' · ' + friendly : ''}${role ? ' - ' + role : ''}${pace ? ' . ' + pace : ''}</span></li>`;
        }).join('');
      }
      const time = day.totalMinutes ? fmtMin(day.totalMinutes) : '';
      const dist = day.distanceMiles ? fmtDist(day.distanceMiles, units) : '';
      const dateStr2 = day.date.toLocaleDateString(locale, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
      const stepsHtml = renderDaySteps(day, units);
      const zoneNames = ZONE_NAMES;
      const isRest = !day.segments || !day.segments.length;
      document.getElementById('dayDetail').innerHTML = `
        <h3>${day.label} — ${dateStr2}</h3>
        <div class="dialog-meta">${time ? t('day.totalFor', { time }) + ' · ' : ''}${dist ? dist+' · ' : ''}${day.type}${week.note ? ' · '+week.note : ''} · ${week.phase}</div>
        ${time ? `<p style="font-size:0.8rem; color:var(--text-muted); margin:8px 0 10px;">${t('day.totalHint')}</p>` : ''}
        <ul class="day-steps">${stepsHtml || '<li class="day-step"><span class="step-text">'+(day.detail||t('day.rest'))+'</span></li>'}</ul>
        <div class="zone-legend" style="margin-top:14px">
          <span class="legend-item"><span class="legend-dot easy"></span> ${zoneNames.E}</span>
          <span class="legend-item"><span class="legend-dot tempo"></span> ${zoneNames.T}</span>
          <span class="legend-item"><span class="legend-dot interval"></span> ${zoneNames.I}</span>
          <span class="legend-item"><span class="legend-dot marathon"></span> ${zoneNames.M}</span>
          <span class="legend-item"><span class="legend-dot long"></span> ${zoneNames.L}</span>
        </div>
        <div class="plan-io" style="margin-top:14px">
          ${isRest
            ? `<button type="button" class="btn-secondary" disabled>${t('field.exportFit')}</button>`
            : `<button type="button" class="btn-secondary" id="exportFitDay">${t('field.exportFit')}</button>`}
          <span class="hint" id="fitExportStatus"></span>
        </div>
      `;
      if (!isRest) {
        const btn = document.getElementById('exportFitDay');
        const status = document.getElementById('fitExportStatus');
        const setStatus = (msg, isErr) => {
          status.textContent = msg || '';
          status.style.color = isErr ? 'var(--danger)' : 'var(--success)';
        };
        btn.addEventListener('click', () => {
          try {
            const name = (typeof FitIO !== 'undefined') ? FitIO.downloadFitForDay(day, vdot) : null;
            if (name) setStatus(t('io.fitExported', { name }));
            else setStatus(t('io.fitRestDay'), true);
          } catch (e) {
            setStatus(t('io.fitExportFailed', { msg: e.message }), true);
          }
        });
      }
    });
  </script>
</body>
</html>
